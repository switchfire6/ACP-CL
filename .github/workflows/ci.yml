name: CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "2"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Run legacy smoke experiment
        run: python -m acp_cl run --config configs/smoke.json --output runs/ci_smoke --device cpu --no-plots
      - name: Run v3 smoke experiment
        run: python -m acp_cl run --config configs/v3_smoke.json --output runs/ci_v3_smoke --device cpu --no-plots
      - name: Run dual-path smoke experiment
        run: python -m acp_cl run --config configs/dual_path_smoke.json --output runs/ci_dual_path_smoke --device cpu --no-plots
      - name: Run joint-persistence smoke experiment
        run: python -m acp_cl.persistence.study --config configs/persistence_smoke.json --output runs/ci_persistence_smoke --device cpu
      - name: Run conditional-relationship smoke experiment
        run: python -m acp_cl.conditional.study --config configs/conditional_smoke.json --output runs/ci_conditional_smoke --device cpu
      - name: Run matched-history smoke experiment
        run: python -m acp_cl.contextual.study --config configs/contextual_smoke.json --output runs/ci_contextual_smoke --device cpu
      - name: Run continued-acquisition smoke diagnostic
        run: python -m acp_cl.acquisition.study --config configs/acquisition_smoke.json --output runs/ci_acquisition_smoke --device cpu
      - name: Run optimizer-by-replay smoke diagnostic
        run: python -m acp_cl.training_state.study --config configs/training_state_smoke.json --output runs/ci_training_state_smoke --device cpu
